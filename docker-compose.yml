version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: flyrank-capstone-db
    environment:
      POSTGRES_USER: flyrank
      POSTGRES_PASSWORD: flyrank_password
      POSTGRES_DB: flyrank_capstone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flyrank -d flyrank_capstone"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
